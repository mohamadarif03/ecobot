<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 360" fill="none">
  <defs>
    <linearGradient id="filter-grad" x1="100" y1="80" x2="100" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FED7AA"/>
      <stop offset="1" stop-color="#FDBA74"/>
    </linearGradient>
    <linearGradient id="butt-paper" x1="100" y1="180" x2="100" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.8" stop-color="#F1F5F9"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <!-- Cigarette Top Rounded Cap -->
  <ellipse cx="100" cy="80" rx="34" ry="12" fill="#FDBA74" stroke="#2B3A55" stroke-width="3"/>

  <!-- Orange/Tan Filter Portion -->
  <path d="M66 80V160C66 168 76 174 100 174C124 174 134 168 134 160V80" fill="url(#filter-grad)" stroke="#2B3A55" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Filter texture dots -->
  <circle cx="82" cy="110" r="1.5" fill="#C2410C" opacity="0.4"/>
  <circle cx="118" cy="115" r="1.5" fill="#C2410C" opacity="0.4"/>
  <circle cx="95" cy="130" r="1.5" fill="#C2410C" opacity="0.4"/>

  <!-- Band Ring Line -->
  <ellipse cx="100" cy="160" rx="34" ry="8" fill="none" stroke="#2B3A55" stroke-width="2.5" stroke-dasharray="3 2"/>

  <!-- White Paper Roll Portion -->
  <path d="M66 160V250C66 262 76 270 100 270C124 270 134 262 134 250V160" fill="url(#butt-paper)" stroke="#2B3A55" stroke-width="3.5"/>

  <!-- Ash & Burnt Tip (Dark grey & crumpled, no burning fire) -->
  <ellipse cx="100" cy="254" rx="33" ry="14" fill="#64748B" stroke="#2B3A55" stroke-width="3"/>
  <ellipse cx="100" cy="258" rx="26" ry="10" fill="#334155"/>
  <ellipse cx="102" cy="260" rx="14" ry="5" fill="#1E293B"/>

  <!-- Tiny Gentle Sad Face on White Portion (Discouraging littering/smoking) -->
  <g>
    <!-- Sad slightly droopy eyes -->
    <ellipse cx="88" cy="204" rx="3.5" ry="4" fill="#2B3A55"/>
    <ellipse cx="112" cy="204" rx="3.5" ry="4" fill="#2B3A55"/>

    <!-- Eyebrows slanted sad -->
    <path d="M84 195L92 198" stroke="#2B3A55" stroke-width="2" stroke-linecap="round"/>
    <path d="M116 195L108 198" stroke="#2B3A55" stroke-width="2" stroke-linecap="round"/>

    <!-- Mildly sad downturned mouth -->
    <path d="M95 220C98 216 102 216 105 220" stroke="#2B3A55" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Subtle tear drop (environmental sadness) -->
    <circle cx="82" cy="214" r="2.2" fill="#38BDF8"/>
  </g>

  <!-- Slight paper crumple fold line -->
  <path d="M68 226C80 232 120 220 132 228" stroke="#CBD5E1" stroke-width="2"/>
</svg>
